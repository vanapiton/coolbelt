---
name: "Build and publish"

on:
  release:
    types: [published]

jobs:
  build:
    name: "Build"
    runs-on: "ubuntu-latest"

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/libs/*.jar

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/javadoc

  publish:
    name: "Publish"
    needs: "build"
    runs-on: "ubuntu-latest"

    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build/libs

      - name: Publish releases
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          game-version-filter: betas

          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-game-versions: b1.7.3
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-dependencies: |
            K9k9gNxR(required)
            rFeWTq4G(optional)
            vf3X9pHM(optional)

          # Modrinth thinks fabric isn't available for older Minecraft versions
          loaders: babric #fabric

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
            build/libs/*-@(dev|sources|javadoc).jar
            
  deploy-pages:
    name: "Deploy JavaDoc to Pages"
    needs: "build"
    runs-on: "ubuntu-latest"

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4