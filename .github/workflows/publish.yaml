---
name: "Build and publish"

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: "Build"
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/libs/*.jar

  publish:
    name: "Publish"
    needs: "build"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build/libs

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_ID }}
          name: ${{ github.event.release.name }}
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          loaders: |-
            babric
            fabric
          game-versions: b1.7.3
          files: build/libs/coolbelt-${{ github.event.release.tag_name }}.jar
          # JSON string inside YAML? Yuck...
          dependencies: |-
            [
              {"project_id": "K9k9gNxR", "dependency_type": "required"},
              {"project_id": "rFeWTq4G", "dependency_type": "optional"},
              {"project_id": "vf3X9pHM", "dependency_type": "optional"}
            ]